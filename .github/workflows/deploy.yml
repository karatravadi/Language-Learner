# Deploys Stilus to Cloudflare on every push to master, after the tests pass.
# It runs `npm run deploy`, which applies any new database migrations (migrations/) and then deploys the Worker.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token from the "Edit Cloudflare Workers" template, with D1 Edit added
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown on the Cloudflare dashboard
# The Worker's own secrets (GEMINI_API_KEY, ACCESS_TEAM, ACCESS_AUD) live in Cloudflare and are not touched.
name: Test and deploy

on:
  push:
    branches: [master]
  workflow_dispatch: # the "Run workflow" button on the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false # never cut a deploy off halfway; the next one waits its turn

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUPPETEER_SKIP_DOWNLOAD: 'true' # the browser test does not run here, so skip its Chrome download
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests and content check
        run: npm test
      - name: Deploy (database migrations, then the Worker)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy
      - name: Skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Not deployed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy automatically."
